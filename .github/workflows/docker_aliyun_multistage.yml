name: DAGSfM Multistage Build & Push to Aliyun ACR
run-name: ${{ github.actor }} build multistage DAGSfM runtime image
on:
  push:
    branches:
      - dev
    paths:
      # 监听多阶段构建文件与当前工作流变更
      - 'docker/Dockerfile.builder'
      - '.github/workflows/docker_aliyun_multistage.yml'
  workflow_dispatch:  # 支持页面手动触发

jobs:
  build-test:
    name: Multistage Build & Push Ubuntu20.04 CUDA11.8
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push 多阶段镜像（指定Dockerfile.builder）
        uses: docker/build-push-action@v5
        with:
          context: .
          # 关键修改：指定新的多阶段构建文件路径
          file: ./docker/Dockerfile.builder
          # 只构建最终 runtime 阶段，不用打包 builder 编译层
          target: runtime
          platforms: linux/amd64
          push: true
          # 可以打上区分标签，和旧镜像做区分
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/dagsfm:v2.0.0
          # GitHub Actions 缓存加速编译，大幅缩短重复构建耗时
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up docker resource
        if: always()
        run: |
          docker system prune -f

      - name: Build Success Notify
        if: success()
        run: echo "✅ 多阶段轻量化镜像构建推送阿里云ACR完成"
